nudge_position:
  target:
    entity:
      integration: norman
      domain: cover
  fields:
    step:
      description: The step (negative or positive) to nudge the cover position by.
      example: 50
      required: true
      selector:
        number:
          min: -100
          max: 100
          mode: box
nudge_tilt:
  target:
    entity:
      integration: norman
      domain: cover
  fields:
    step:
      description: The step (negative or positive) to nudge the cover tilt by.
      example: 50
      required: true
      selector:
        number:
          min: -100
          max: 100
          mode: box
